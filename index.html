<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometriquiz: Sammensatte figurer</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; color: #333; max-width: 900px; margin: 0 auto; padding: 20px; text-align: center; }
        h1 { color: #2c3e50; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        canvas { background-color: #ffffff; border: 2px solid #bdc3c7; border-radius: 8px; }
        .input-panel { background: white; padding: 25px; border-radius: 8px; border: 2px solid #bdc3c7; text-align: left; min-width: 280px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-sjekk { background-color: #2ecc71; color: white; }
        .btn-neste { background-color: #3498db; color: white; }
        .btn-hint { background-color: #f1c40f; color: #333; }
        .tilbakemelding { font-weight: bold; margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
        .suksess { background-color: #d4edda; color: #155724; }
        .feil { background-color: #f8d7da; color: #721c24; }
    </style>

    <script>
        var gjeldende = {};
        var canvas, ctx;
        var RUTE = 30;
        var OX = 60;
        var OY = 60;

        function oppstart() {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            genererNyFigur();
        }

        function tegnRutenett() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#e5e5e5';
            ctx.lineWidth = 1;
            for (var x = 0; x <= canvas.width; x += RUTE) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (var y = 0; y <= canvas.height; y += RUTE) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        }

        function tegnMål(x1, y1, x2, y2, tekst, underEllerVenstre) {
            ctx.strokeStyle = '#e74c3c';
            ctx.fillStyle = '#e74c3c';
            ctx.lineWidth = 2;
            ctx.font = 'bold 13px Arial';

            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            ctx.beginPath();
            if (x1 === x2) {
                ctx.moveTo(x1 - 4, y1); ctx.lineTo(x1 + 4, y1);
                ctx.moveTo(x2 - 4, y2); ctx.lineTo(x2 + 4, y2);
            } else {
                ctx.moveTo(x1, y1 - 4); ctx.lineTo(x1, y1 + 4);
                ctx.moveTo(x2, y2 - 4); ctx.lineTo(x2, y2 + 4);
            }
            ctx.stroke();

            ctx.fillStyle = '#2c3e50';
            var mx = (x1 + x2) / 2;
            var my = (y1 + y2) / 2;
            
            if (x1 === x2) {
                ctx.textAlign = underEllerVenstre ? 'right' : 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(tekst, mx + (underEllerVenstre ? -8 : 8), my);
            } else {
                ctx.textAlign = 'center';
                ctx.textBaseline = underEllerVenstre ? 'top' : 'bottom';
                ctx.fillText(tekst, mx, my + (underEllerVenstre ? 6 : -6));
            }
        }

        function genererNyFigur() {
            document.getElementById('areal-input').value = '';
            document.getElementById('omkrets-input').value = '';
            document.getElementById('tilbakemelding').style.display = 'none';
            document.getElementById('hint-boks').style.display = 'none';

            tegnRutenett();

            var typer = ['Rektangel', 'Trapp (L-figur)', 'U-form (Grop)', 'Hus (Rektangel + Trekant)', 'Pil (Rektangel + Trekant)', 'Seil (Rektangel + Trekant)'];
            var valg = typer[Math.floor(Math.random() * typer.length)];
            document.getElementById('figur-navn').innerText = "Figur: " + valg;

            ctx.fillStyle = '#a8dadc';
            ctx.strokeStyle = '#457b9d';
            ctx.lineWidth = 3;

            var areal = 0;
            var omkrets = 0;
            var hint = "";

            if (valg === 'Rektangel') {
                var w = 8; var h = 5;
                ctx.fillRect(OX, OY, w * RUTE, h * RUTE);
                ctx.strokeRect(OX, OY, w * RUTE, h * RUTE);

                tegnMål(OX, OY - 15, OX + w * RUTE, OY - 15, w + " cm", false);
                tegnMål(OX - 15, OY, OX - 15, OY + h * RUTE, h + " cm", true);

                areal = w * h; omkrets = 2 * (w + h);
                hint = "Dette er et enkelt rektangel. Areal = lengde × bredde. Omkrets = summen av alle fire sidene.";

            } else if (valg === 'Trapp (L-figur)') {
                var w1 = 4; var w2 = 4; var h1 = 3; var h2 = 4;
                ctx.beginPath();
                ctx.moveTo(OX, OY);
                ctx.lineTo(OX + w1 * RUTE, OY);
                ctx.lineTo(OX + w1 * RUTE, OY + h1 * RUTE);
                ctx.lineTo(OX + (w1+w2) * RUTE, OY + h1 * RUTE);
                ctx.lineTo(OX + (w1+w2) * RUTE, OY + (h1+h2) * RUTE);
                ctx.lineTo(OX, OY + (h1+h2) * RUTE);
                ctx.closePath(); ctx.fill(); ctx.stroke();

                tegnMål(OX, OY - 15, OX + w1 * RUTE, OY - 15, w1 + " cm", false);
                tegnMål(OX - 15, OY, OX - 15, OY + (h1+h2) * RUTE, (h1+h2) + " cm", true);
                tegnMål(OX + w1 * RUTE + 15, OY + h1 * RUTE, OX + w1 * RUTE + 15, OY + (h1+h2) * RUTE, h2 + " cm", false);
                tegnMål(OX, OY + (h1+h2) * RUTE + 15, OX + (w1+w2) * RUTE, OY + (h1+h2) * RUTE + 15, (w1+w2) + " cm", true);

                areal = (w1 * h1) + ((w1 + w2) * h2);
                omkrets = (w1 + w2) + (h1 + h2) + w1 + h1 + w2 + h2;
                hint = "Del opp figuren i to rektangler. Areal = (" + w1 + "×" + h1 + ") + (" + (w1+w2) + "×" + h2 + ") = " + areal + " cm².";

            } else if (valg === 'U-form (Grop)') {
                var totalW = 10; var totalH = 5; var hullW = 4; var hullH = 3; var sideW = 3;
                ctx.beginPath();
                ctx.moveTo(OX, OY);
                ctx.lineTo(OX + sideW * RUTE, OY);
                ctx.lineTo(OX + sideW * RUTE, OY + hullH * RUTE);
                ctx.lineTo(OX + (sideW + hullW) * RUTE, OY + hullH * RUTE);
                ctx.lineTo(OX + (sideW + hullW) * RUTE, OY);
                ctx.lineTo(OX + totalW * RUTE, OY);
                ctx.lineTo(OX + totalW * RUTE, OY + totalH * RUTE);
                ctx.lineTo(OX, OY + totalH * RUTE);
                ctx.closePath(); ctx.fill(); ctx.stroke();

                tegnMål(OX, OY + totalH * RUTE + 15, OX + totalW * RUTE, OY + totalH * RUTE + 15, totalW + " cm", true);
                tegnMål(OX - 15, OY, OX - 15, OY + totalH * RUTE, totalH + " cm", true);
                tegnMål(OX + sideW * RUTE, OY + 15, OX + (sideW + hullW) * RUTE, OY + 15, hullW + " cm", true);
                tegnMål(OX + sideW * RUTE - 10, OY, OX + sideW * RUTE - 10, OY + hullH * RUTE, hullH + " cm", true);

                areal = (totalW * totalH) - (hullW * hullH);
                omkrets = totalW + (totalH * 2) + (hullH * 2) + hullW;
                hint = "Tips: Ta arealet av det store rektanglet (" + totalW + "×" + totalH + ") og trekk fra hullet (" + hullW + "×" + hullH + ").";

            } else if (valg === 'Hus (Rektangel + Trekant)') {
                var husW = 8; var rektH = 4; var takH = 3;
                var startY = OY + takH * RUTE;

                ctx.beginPath();
                ctx.moveTo(OX, startY);
                ctx.lineTo(OX + (husW/2) * RUTE, OY); 
                ctx.lineTo(OX + husW * RUTE, startY);
                ctx.lineTo(OX + husW * RUTE, startY + rektH * RUTE);
                ctx.lineTo(OX, startY + rektH * RUTE);
                ctx.closePath(); ctx.fill(); ctx.stroke();

                ctx.strokeStyle = '#457b9d'; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(OX + (husW/2) * RUTE, OY); ctx.lineTo(OX + (husW/2) * RUTE, startY); ctx.stroke();

                tegnMål(OX, startY + rektH * RUTE + 15, OX + husW * RUTE, startY + rektH * RUTE + 15, husW + " cm", true);
                tegnMål(OX - 15, startY, OX - 15, startY + rektH * RUTE, rektH + " cm", true);
                tegnMål(OX + (husW/2) * RUTE + 8, OY, OX + (husW/2) * RUTE + 8, startY, takH + " cm", false);

                var skraa = Math.sqrt(Math.pow(husW/2, 2) + Math.pow(takH, 2)); 
                areal = (husW * rektH) + (0.5 * husW * takH);
                omkrets = husW + (rektH * 2) + (skraa * 2);
                hint = "Figuren består av et rektangel i bunn og en trekant på topp. Areal = (" + husW + "×" + rektH + ") + (" + husW + "×" + takH + "/2) = " + areal + " cm².";

            } else if (valg === 'Pil (Rektangel + Trekant)') {
                var rW = 6; var rH = 4; var spissW = 3;
                var midtY = OY + 2 * RUTE; 

                ctx.beginPath();
                ctx.moveTo(OX, OY);
                ctx.lineTo(OX + rW * RUTE, OY);
                ctx.lineTo(OX + rW * RUTE, OY - 1 * RUTE); 
                ctx.lineTo(OX + (rW + spissW) * RUTE, midtY); 
                ctx.lineTo(OX + rW * RUTE, OY + (rH + 1) * RUTE); 
                ctx.lineTo(OX + rW * RUTE, OY + rH * RUTE);
                ctx.lineTo(OX, OY + rH * RUTE);
                ctx.closePath(); ctx.fill(); ctx.stroke();

                tegnMål(OX, OY + rH * RUTE + 15, OX + rW * RUTE, OY + rH * RUTE + 15, rW + " cm", true);
                tegnMål(OX - 15, OY, OX - 15, OY + rH * RUTE, rH + " cm", true);
