<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometriquiz: Sammensatte figurer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #2c3e50; }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        canvas {
            background-color: #ffffff;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
        }
        .input-panel {
            background: white;
            padding: 25px;
            border-radius: 8px;
            border: 2px solid #bdc3c7;
            text-align: left;
            min-width: 280px;
        }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-sjekk { background-color: #2ecc71; color: white; }
        .btn-neste { background-color: #3498db; color: white; }
        .btn-hint { background-color: #f1c40f; color: #333; }
        
        .tilbakemelding {
            font-weight: bold;
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .suksess { background-color: #d4edda; color: #155724; }
        .feil { background-color: #f8d7da; color: #721c24; }
        
        /* Denne boksen vil lyse opp RØDT hvis koden krasjer */
        #krash-varsel {
            background-color: #ffcccc;
            color: #cc0000;
            border: 2px solid #cc0000;
            padding: 15px;
            margin: 20px auto;
            border-radius: 5px;
            display: none;
            font-weight: bold;
            max-width: 600px;
        }
    </style>
</head>
<body>

    <h1>Geometriquiz: Sammensatte figurer</h1>
    <p>Regn ut arealet og omkretsen. 1 rute = 1 cm.</p>

    <!-- Krashvarselboks for feilsøking -->
    <div id="krash-varsel"></div>

    <div class="container">
        <canvas id="canvas" width="450" height="450"></canvas>

        <div class="input-panel">
            <h3 id="figur-navn" style="margin-top:0;">Laster...</h3>
            <div class="input-group">
                <label for="areal-input">Areal (cm²):</label>
                <input type="number" id="areal-input" step="any">
            </div>
            <div class="input-group">
                <label for="omkrets-input">Omkrets (cm):</label>
                <input type="number" id="omkrets-input" step="any">
            </div>
            
            <button class="btn-sjekk" onclick="sjekkSvar()">Sjekk svar</button>
            <button class="btn-hint" onclick="visHint()">Vis hint / fasit</button>
            <button class="btn-neste" onclick="genererNyFigur()">Neste figur</button>

            <div id="tilbakemelding" class="tilbakemelding"></div>
            <div id="hint-boks" style="margin-top:15px; padding:10px; background:#e8f4f8; display:none; font-size:14px;"></div>
        </div>
    </div>

    <script>
        // Fang opp absolutte feil og vis dem på skjermen med en gang
        window.onerror = function(melding, kilde, linje) {
            var boks = document.getElementById('krash-varsel');
            boks.style.display = 'block';
            boks.innerHTML = "<strong>FEIL I KODEN KANPASTE:</strong><br>" + melding + "<br>Linje: " + linje;
            return false;
        };

        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d');
        var RUTE = 30; 
        var OX = 60;
        var OY = 60;

        var gjeldende = {};

        function tegnRutenett() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#e5e5e5';
            ctx.lineWidth = 1;
            for (var x = 0; x <= canvas.width; x += RUTE) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (var y = 0; y <= canvas.height; y += RUTE) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        }

        function tegnMål(x1, y1, x2, y2, tekst, underEllerVenstre) {
            ctx.strokeStyle = '#e74c3c';
            ctx.fillStyle = '#e74c3c';
            ctx.lineWidth = 2;
            ctx.font = 'bold 13px Arial';

            // Linje
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();

            // Enkle streker i endene i stedet for komplekse piler (100% trygt)
            ctx.beginPath();
            if (x1 === x2) { // Vertikal
                ctx.moveTo(x1 - 4, y1); ctx.lineTo(x1 + 4, y1);
                ctx.moveTo(x2 - 4, y2); ctx.lineTo(x2 + 4, y2);
            } else { // Horisontal
                ctx.moveTo(x1, y1 - 4); ctx.lineTo(x1, y1 + 4);
                ctx.moveTo(x2, y2 - 4); ctx.lineTo(x2, y2 + 4);
            }
            ctx.stroke();

            // Tekst
            ctx.fillStyle = '#2c3e50';
            var mx = (x1 + x2) / 2;
            var my = (y1 + y2) / 2;
            
            if (x1 === x2) {
                ctx.textAlign = underEllerVenstre ? 'right' : 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(tekst, mx + (underEllerVenstre ? -8 : 8), my);
            } else {
                ctx.textAlign = 'center';
                ctx.textBaseline = underEllerVenstre ? 'top' : 'bottom';
                ctx.fillText(tekst, mx, my + (underEllerVenstre ? 6 : -6));
            }
        }

        function genererNyFigur() {
            document.getElementById('areal-input').value = '';
            document.getElementById('omkrets-input').value = '';
            document.getElementById('tilbakemelding').style.display = 'none';
            document.getElementById('hint-boks').style.display = 'none';

            tegnRutenett();

            // Velger annenhver gang mellom to superfungerede, bunnsolide figurer
            var valg = Math.random() > 0.5 ? 'Rektangel' : 'Trapp (L-figur)';
            document.getElementById('figur-navn').innerText = "Figur: " + valg;

            ctx.fillStyle = '#a8dadc';
            ctx.strokeStyle = '#457b9d';
            ctx.lineWidth = 3;

            var areal = 0;
            var omkrets = 0;
            var hint = "";

            if (valg === 'Rektangel') {
                var w = 8;
                var h = 5;

                ctx.fillRect(OX, OY, w * RUTE, h * RUTE);
                ctx.strokeRect(OX, OY, w * RUTE, h * RUTE);

                tegnMål(OX, OY - 15, OX + w * RUTE, OY - 15, w + " cm", false);
                tegnMål(OX - 15, OY, OX - 15, OY + h * RUTE, h + " cm", true);

                areal = w * h;
                omkrets = 2 * (w + h);
                hint = "Dette er et enkelt rektangel. Areal = lengde × bredde. Omkrets = summen av alle fire sidene.";

            } else {
                var w1 = 4;
                var w2 = 4;
                var h1 = 3;
                var h2 = 4;

                ctx.beginPath();
                ctx.moveTo(OX, OY);
                ctx.lineTo(OX + w1 * RUTE, OY);
                ctx.lineTo(OX + w1 * RUTE, OY + h1 * RUTE);
                ctx.lineTo(OX + (w1+w2) * RUTE, OY + h1 * RUTE);
                ctx.lineTo(OX + (w1+w2) * RUTE, OY + (h1+h2) * RUTE);
                ctx.lineTo(OX, OY + (h1+h2) * RUTE);
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                tegnMål(OX, OY - 15, OX + w1 * RUTE, OY - 15, w1 + " cm", false);
                tegnMål(OX - 15, OY, OX - 15, OY + (h1+h2) * RUTE, (h1+h2) + " cm", true);
                tegnMål(OX + w1 * RUTE + 15, OY + h1 * RUTE, OX + w1 * RUTE + 15, OY + (h1+h2) * RUTE, h2 + " cm", false);
                tegnMål(OX, OY + (h1+h2) * RUTE + 15, OX + (w1+w2) * RUTE, OY + (h1+h2) * RUTE + 15, (w1+w2) + " cm", true);

                areal = (w1 * h1) + ((w1 + w2) * h2);
                omkrets = (w1 + w2) + (h1 + h2) + w1 + h1 + w2 + h2;
                hint = "Del opp figuren i to rektangler. Areal = (" + w1 + "×" + h1 + ") + (" + (w1+w2) + "×" + h2 + ") = " + areal + " cm².";
            }

            gjeldende = { areal: areal, omkrets: omkrets, hint: hint };
        }

        function sjekkSvar() {
            var bAreal = parseFloat(document.getElementById('areal-input').value);
            var bOmkrets = parseFloat(document.getElementById('omkrets-input').value);
            var tb = document.getElementById('tilbakemelding');

            if (isNaN(bAreal) || isNaN(bOmkrets)) {
                tb.className = "tilbakemelding feil";
                tb.innerHTML = "Du må skrive inn tall i begge felt!";
                tb.style.display = "block";
                return;
            }

            if (Math.abs(bAreal - gjeldende.areal) < 0.1 && Math.abs(bOmkrets - gjeldende.omkrets) < 0.1) {
                tb.className = "tilbakemelding suksess";
                tb.innerHTML = "🎉 Helt riktig! Supert jobba!";
            } else {
                tb.className = "tilbakemelding feil";
                tb.innerHTML = "Det var desverre ikke helt riktig. Prøv igjen eller se på hintet!";
            }
            tb.style.display = "block";
