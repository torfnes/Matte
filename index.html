<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matte-duell med Sjakklokke</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        /* Innstillinger panel */
        .setup-panel {
            background-color: #34495e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            font-size: 14px;
        }

        .input-group label {
            margin-bottom: 5px;
            color: #bdc3c7;
        }

        .input-group input {
            padding: 8px;
            border-radius: 4px;
            border: none;
            width: 70px;
            font-size: 16px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
        }

        button:hover {
            background-color: #27ae60;
        }

        /* Spillområde */
        .game-area {
            display: none;
            width: 100%;
            max-width: 500px;
            flex-direction: column;
            align-items: center;
        }

        /* Sjakklokkene */
        .clocks-container {
            display: flex;
            width: 100%;
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock {
            flex: 1;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            font-weight: bold;
            background-color: #e74c3c;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s, transform 0.1s;
        }

        .clock.active {
            background-color: #2ecc71;
            transform: scale(1.05);
            box-shadow: 0 8px 12px rgba(46, 204, 113, 0.4);
        }

        .clock-label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        /* Oppgave og input */
        .task-display {
            font-size: 42px;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 10px;
        }

        .turn-display {
            font-size: 16px;
            font-style: italic;
            color: #bdc3c7;
            margin-bottom: 20px;
        }

        .answer-input {
            font-size: 28px;
            padding: 10px;
            width: 150px;
            text-align: center;
            border-radius: 8px;
            border: 3px solid #34495e;
            background-color: #ecf0f1;
            color: #2c3e50;
        }

        .answer-input:focus {
            outline: none;
            border-color: #f1c40f;
        }
    </style>
</head>
<body>

    <h1>MATTE-DUELL</h1>
    
    <!-- Innstillinger -->
    <div class="setup-panel" id="setupPanel">
        <div class="input-group">
            <label for="minNum">Minste tall</label>
            <input type="number" id="minNum" value="1">
        </div>
        <div class="input-group">
            <label for="maxNum">Største tall</label>
            <input type="number" id="maxNum" value="10">
        </div>
        <div class="input-group">
            <label for="gameTime">Sekunder</label>
            <input type="number" id="gameTime" value="60">
        </div>
        <div style="width: 100%; text-align: center;">
            <button onclick="startGame()">START SPILLET</button>
        </div>
    </div>

    <!-- Spillområde -->
    <div class="game-area" id="gameArea">
        <div class="clocks-container">
            <div class="clock" id="clock0">
                <div class="clock-label">Spiller 1</div>
                <span id="time0">60.0</span>s
            </div>
            <div class="clock" id="clock1">
                <div class="clock-label">Spiller 2</div>
                <span id="time1">60.0</span>s
            </div>
        </div>

        <div class="task-display" id="taskDisplay">0 x 0 = ?</div>
        <div class="turn-display" id="turnDisplay">Gjør deg klar...</div>
        
        <input type="number" class="answer-input" id="answerInput" placeholder="Svar..." autocomplete="off">
    </div>

    <script>
        // Spillvariabler
        let playerTimes = [60.0, 60.0];
        let activePlayer = 0; 
        let isGameActive = false;
        let currentAnswer = 0;
        let minNum = 1;
        let maxNum = 10;
        let timerInterval = null;

        const answerInput = document.getElementById('answerInput');

        // Lyssne etter Enter-tast i svarfeltet
        answerInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                checkAnswer();
            }
        });

        function startGame() {
            minNum = parseInt(document.getElementById('minNum').value);
            maxNum = parseInt(document.getElementById('maxNum').value);
            const startTime = parseFloat(document.getElementById('gameTime').value);

            if (isNaN(minNum) || isNaN(maxNum) || isNaN(startTime) || minNum > maxNum || startTime <= 0) {
                alert("Vennligst oppgi gyldige tall og tider.");
                return;
            }

            // Nullstill spilltilstand
            playerTimes = [startTime, startTime];
            activePlayer = Math.floor(Math.random() * 2); // Tilfeldig hvem som starter
            isGameActive = true;

            // Oppdater grensesnitt
            document.getElementById('setupPanel').style.display = 'none';
            document.getElementById('gameArea').style.display = 'flex';
            
            answerInput.value = '';
            
            // Liten forsinkelse for å sikre at feltet er synlig før det fokuseres
            setTimeout(() => {
                answerInput.focus();
            }, 50);

            updateClockDisplay();
            generateTask();

            // Start nedtelling (kjører hvert 100. millisekund)
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTime, 100);
        }

        function generateTask() {
            const num1 = Math.floor(Math.random() * (maxNum - minNum + 1)) + minNum;
            const num2 = Math.floor(Math.random() * (maxNum - minNum + 1)) + minNum;
            currentAnswer = num1 * num2;

            document.getElementById('taskDisplay').textContent = `${num1}  x  ${num2}  =  ?`;
            document.getElementById('turnDisplay').textContent = `Det er SPILLER ${activePlayer + 1} som må svare!`;
            
            updateClockDisplay();
        }

        function checkAnswer() {
            if (!isGameActive) return;

            const userAnswer = parseInt(answerInput.value);
            if (isNaN(userAnswer)) return;

            if (userAnswer === currentAnswer) {
                // RIKTIG SVAR: Bytt aktiv spiller umiddelbart
                activePlayer = activePlayer === 0 ? 1 : 0;
                answerInput.value = '';
                generateTask();
            } else {
                // FEIL SVAR: Tøm feltet, tiden fortsetter å løpe
                answerInput.value = '';
            }
        }

        function updateTime() {
            if (!isGameActive) return;

            // Trekk fra 0.1 sekund fra den aktive spilleren
            playerTimes[activePlayer] -= 0.1;

            // Sjekk om tiden har gått ut
            if (playerTimes[activePlayer] <= 0) {
                playerTimes[activePlayer] = 0;
                isGameActive = false;
                clearInterval(timerInterval);
                updateClockDisplay();

                const winner = activePlayer === 0 ? 2 : 1;
                
                setTimeout(() => {
                    alert(`Tiden er ute!\n\nSpiller ${activePlayer + 1} gikk tom for tid.\nSpiller ${winner} VINNER DUELLEN! 🏆`);
                    document.getElementById('setupPanel').style.display = 'flex';
                    document.getElementById('gameArea').style.display = 'none';
                }, 50);
                return;
            }

            updateClockDisplay();
        }

        function updateClockDisplay() {
            // FIKSET: Lagt til riktige indekser [0] og [1] for spillerne
            document.getElementById('time0').textContent = playerTimes[0].toFixed(1);
            document.getElementById('time1').textContent = playerTimes[1].toFixed(1);

            const clock0 = document.getElementById('clock0');
            const clock1 = document.getElementById('clock1');

            if (activePlayer === 0) {
                clock0.classList.add('active');
                clock1.classList.remove('active');
            } else {
                clock0.classList.remove('active');
                clock1.classList.add('active');
            }
        }
