<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regn ut Areal og Omkrets</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 650px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        canvas {
            background: #fff;
            border: 1px solid #ccc;
            margin: 20px 0;
            border-radius: 4px;
        }
        .input-group {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        input[type="number"] {
            padding: 8px;
            width: 100px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #45a049;
        }
        button.secondary {
            background-color: #2196F3;
        }
        button.secondary:hover {
            background-color: #0b7dda;
        }
        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 18px;
            min-height: 24px;
        }
        .correct { color: #2e7d32; }
        .wrong { color: #c62828; }
    </style>
</head>
<body>

<div class="container">
    <h2>Finn areal og omkrets av den sammensatte figuren</h2>
    <p>Figuren er sammensatt av rektangler og trekanter. Målene er oppgitt i centimeter (cm).</p>
    
    <canvas id="figurCanvas" width="450" height="350"></canvas>

    <div class="input-group">
        <label for="arealInput"><strong>Areal (cm²):</strong></label>
        <input type="number" id="arealInput" step="any" placeholder="Svar">
    </div>

    <div class="input-group">
        <label for="omkretsInput"><strong>Omkrets (cm):</strong></label>
        <input type="number" id="omkretsInput" step="any" placeholder="Svar">
    </div>

    <div style="margin-top: 20px; display: flex; justify-content: center; gap: 10px;">
        <button onclick="sjekkSvar()">Sjekk svar</button>
        <button class="secondary" onclick="genererNyOppgave()">Ny oppgave</button>
    </div>

    <div id="tilbakemelding" class="feedback"></div>
</div>

<script>
    let gjeldendeFigurType = 0; 
    let maal = {}; 
    let riktigAreal = 0;
    let riktigOmkrets = 0;

    function genererNyOppgave() {
        document.getElementById('arealInput').value = '';
        document.getElementById('omkretsInput').value = '';
        document.getElementById('tilbakemelding').innerHTML = '';

        gjeldendeFigurType = Math.floor(Math.random() * 5);
        maal = {};

        if (gjeldendeFigurType === 0) {
            maal.bredde = Math.floor(Math.random() * 5) + 6;      
            maal.hoydeRekt = Math.floor(Math.random() * 4) + 4;   
            maal.hoydeTrekant = Math.floor(Math.random() * 3) + 4; 

            let halvb = maal.bredde / 2;
            let hypotenus = Math.sqrt(halvb*halvb + maal.hoydeTrekant*maal.hoydeTrekant);

            riktigAreal = (maal.bredde * maal.hoydeRekt) + ((maal.bredde * maal.hoydeTrekant) / 2);
            riktigOmkrets = maal.bredde + (2 * maal.hoydeRekt) + (2 * hypotenus);

        } else if (gjeldendeFigurType === 1) {
            maal.breddeSide = Math.floor(Math.random() * 2) + 3;  
            maal.breddeMidt = Math.floor(Math.random() * 3) + 4;  
            maal.hoydeSide = Math.floor(Math.random() * 2) + 3;   
            maal.hoydeMidt = maal.hoydeSide + (Math.floor(Math.random() * 3) + 3); 
            maal.hoydeTrekant = Math.floor(Math.random() * 3) + 3;

            let halvb = maal.breddeMidt / 2;
            let hypotenus = Math.sqrt(halvb*halvb + maal.hoydeTrekant*maal.hoydeTrekant);

            riktigAreal = ((maal.breddeMidt * maal.hoydeTrekant) / 2) + (maal.breddeMidt * maal.hoydeMidt) + (2 * maal.breddeSide * maal.hoydeSide);
            let hoppOppMellomrom = maal.hoydeMidt - maal.hoydeSide;
            riktigOmkrets = (2 * maal.breddeSide) + maal.breddeMidt + (2 * maal.hoydeSide) + (2 * hoppOppMellomrom) + (2 * hypotenus);

        } else if (gjeldendeFigurType === 2) {
            maal.breddeSkaft = Math.floor(Math.random() * 3) + 4; 
            maal.hoydeSkaft = Math.floor(Math.random() * 3) + 5;  
            maal.utstikk = Math.floor(Math.random() * 2) + 2;     
            maal.breddeTopp = maal.breddeSkaft + (2 * maal.utstikk);
            maal.hoydeTrekant = Math.floor(Math.random() * 3) + 4;

            let halvbTopp = maal.breddeTopp / 2;
            let hypotenus = Math.sqrt(halvbTopp*halvbTopp + maal.hoydeTrekant*maal.hoydeTrekant);

            riktigAreal = (maal.breddeSkaft * maal.hoydeSkaft) + ((maal.breddeTopp * maal.hoydeTrekant) / 2);
            riktigOmkrets = maal.breddeSkaft + (2 * maal.hoydeSkaft) + (2 * maal.utstikk) + (2 * hypotenus);

        } else if (gjeldendeFigurType === 3) {
            maal.breddeVenstre = Math.floor(Math.random() * 3) + 4; 
            maal.breddeHoyre = Math.floor(Math.random() * 3) + 4;   
            maal.hoydeVenstre = Math.floor(Math.random() * 3) + 4;  
            maal.hoydeMidtVeegg = maal.hoydeVenstre + (Math.floor(Math.random() * 3) + 3); 
            maal.hoydeTrekant = Math.floor(Math.random() * 3) + 3;  

            let skraaside = Math.sqrt(maal.breddeHoyre*maal.breddeHoyre + maal.hoydeTrekant*maal.hoydeTrekant);

            let arealRekt1 = maal.breddeVenstre * maal.hoydeVenstre;
            let arealRekt2 = maal.breddeHoyre * maal.hoydeMidtVeegg;
            let arealTrekant = (maal.breddeHoyre * maal.hoydeTrekant) / 2;
            riktigAreal = arealRekt1 + arealRekt2 + arealTrekant;

            let hoppOppI_Midten = maal.hoydeMidtVeegg - maal.hoydeVenstre;
            riktigOmkrets = maal.breddeVenstre + maal.breddeHoyre + maal.hoydeVenstre + hoppOppI_Midten + (maal.hoydeMidtVeegg + maal.hoydeTrekant) + skraaside;

        } else if (gjeldendeFigurType === 4) {
            maal.breddeTelt = Math.floor(Math.random() * 2) + 4; 
            maal.hoydeBase = Math.floor(Math.random() * 3) + 4;  
            maal.hoydeTopper = Math.floor(Math.random() * 3) + 4; 

            let halvBreddeTelt = maal.breddeTelt / 2;
            let hypotenusEnSide = Math.sqrt(halvBreddeTelt*halvBreddeTelt + maal.hoydeTopper*maal.hoydeTopper);

            let totalBredde = maal.breddeTelt * 2;
            let arealRekt = totalBredde * maal.hoydeBase;
            let arealToTrekanter = 2 * ((maal.breddeTelt * maal.hoydeTopper) / 2);
            riktigAreal = arealRekt + arealToTrekanter;

            riktigOmkrets = totalBredde + (2 * maal.hoydeBase) + (4 * hypotenusEnSide);
        }

        tegnFigur();
    }

    function tegnFigur() {
        const canvas = document.getElementById('figurCanvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const skala = 18; 
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#333';
        ctx.font = '15px Arial';

        if (gjeldendeFigurType === 0) {
            let totalBreddePx = maal.bredde * skala;
            let startX = (canvas.width - totalBreddePx) / 2;
            let startY = 280;

            ctx.fillStyle = '#e3f2fd'; 
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(startX, startY - (maal.hoydeRekt * skala));
            ctx.lineTo(startX + totalBreddePx/2, startY - ((maal.hoydeRekt + maal.hoydeTrekant) * skala));
            ctx.lineTo(startX + totalBreddePx, startY - (maal.hoydeRekt * skala));
            ctx.lineTo(startX + totalBreddePx, startY);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#000'; ctx.textAlign = 'center';
            ctx.fillText(maal.bredde + ' cm', startX + totalBreddePx/2, startY + 25);
            ctx.textAlign = 'right';
            ctx.fillText(maal.hoydeRekt + ' cm', startX - 10, startY - (maal.hoydeRekt * skala / 2));

            tegnStipletLinje(ctx, startX + totalBreddePx/2, startY - (maal.hoydeRekt * skala), startX + totalBreddePx/2, startY - ((maal.hoydeRekt + maal.hoydeTrekant) * skala));
            ctx.textAlign = 'left';
            ctx.fillText('h = ' + maal.hoydeTrekant + ' cm', startX + totalBreddePx/2 + 5, startY - (maal.hoydeRekt * skala) - (maal.hoydeTrekant * skala / 2));

        } else if (gjeldendeFigurType === 1) {
            let totalBredde = (2 * maal.breddeSide) + maal.breddeMidt;
            let startX = (canvas.width - (totalBredde * skala)) / 2;
            let startY = 300;

            ctx.fillStyle = '#fff9c4'; 
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(startX, startY - (maal.hoydeSide * skala));
            ctx.lineTo(startX + (maal.breddeSide * skala), startY - (maal.hoydeSide * skala));
            ctx.lineTo(startX + (maal.breddeSide * skala), startY - (maal.hoydeMidt * skala));
            ctx.lineTo(startX + ((maal.breddeSide + maal.breddeMidt/2) * skala), startY - ((maal.hoydeMidt + maal.hoydeTrekant) * skala));
            ctx.lineTo(startX + ((maal.breddeSide + maal.breddeMidt) * skala), startY - (maal.hoydeMidt * skala));
            ctx.lineTo(startX + ((maal.breddeSide + maal.breddeMidt) * skala), startY - (maal.hoydeSide * skala));
