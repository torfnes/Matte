<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometriøving for elever</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 550px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #2c3e50; margin-top: 0; font-size: 24px; }
        #canvas-container {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }
        canvas {
            border: 2px dashed #b2bec3;
            background-color: #fafafa;
            border-radius: 8px;
        }
        .input-group {
            margin: 15px 0;
            text-align: left;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #34495e;
        }
        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        .correct { border-color: #2ecc71 !important; background-color: #e8f8f5; }
        .wrong { border-color: #e74c3c !important; background-color: #fceae9; }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background 0.2s;
        }
        button:hover { background-color: #2980b9; }
        #feedback { font-weight: bold; margin-top: 15px; font-size: 18px; }
        #figurnavn { font-style: italic; color: #7f8c8d; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Areal og omkrets</h1>
    <div id="figurnavn"></div>
    <p>Rund av svarene til nærmeste hele tall om nødvendig (bruk pi = 3,14).</p>
    
    <div id="canvas-container">
        <canvas id="figurCanvas" width="450" height="320"></canvas>
    </div>

    <div class="input-group">
        <label id="label-areal" for="input-areal">Hva er arealet (cm²)?</label>
        <input type="number" id="input-areal" placeholder="Skriv svar her...">
    </div>

    <div class="input-group">
        <label id="label-omkrets" for="input-omkrets">Hva er omkretsen (cm)?</label>
        <input type="number" id="input-omkrets" placeholder="Skriv svar her...">
    </div>

    <button onclick="sjekkSvar()">Sjekk svar</button>
    <button onclick="genererNyFigur()" style="background-color: #2ecc71; margin-top: 10px;">Neste figur</button>

    <div id="feedback"></div>
</div>

<script>
    const canvas = document.getElementById('figurCanvas');
    const ctx = canvas.getContext('2d');
    
    let gjeldendeFigur = "";
    let fasitAreal = 0;
    let fasitOmkrets = 0;

    function slettFelter() {
        document.getElementById('input-areal').value = "";
        document.getElementById('input-omkrets').value = "";
        document.getElementById('input-areal').className = "";
        document.getElementById('input-omkrets').className = "";
        document.getElementById('feedback').textContent = "";
    }

    function tilfeldig(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function genererNyFigur() {
        slettFelter();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Nullstill linjestil slik at vi starter uten stiplede linjer
        ctx.setLineDash([]);

        const figurTyper = ['rektangel', 'trekant', 'sirkel', 'halvsirkel', 'sammensatt_rektangel', 'rektangel_trekant', 'avskjaert_rektangel'];
        gjeldendeFigur = figurTyper[Math.floor(Math.random() * figurTyper.length)];

        ctx.lineWidth = 3;
        ctx.strokeStyle = '#2c3e50';
        ctx.fillStyle = '#74b9ff';
        ctx.font = 'bold 14px Arial';

        if (gjeldendeFigur === 'rektangel') {
            document.getElementById('figurnavn').textContent = "Figurtype: Rektangel";
            let b = tilfeldig(5, 14);
            let h = tilfeldig(4, 9);
            fasitAreal = b * h;
            fasitOmkrets = 2 * (b + h);

            let scale = 22;
            let pxB = b * scale;
            let pxH = h * scale;
            let x = (canvas.width - pxB) / 2;
            let y = (canvas.height - pxH) / 2;

            ctx.fillRect(x, y, pxB, pxH);
            ctx.strokeRect(x, y, pxB, pxH);

            ctx.fillStyle = '#2c3e50';
            ctx.fillText(`${b} cm`, x + pxB/2 - 15, y - 10);
            ctx.fillText(`${h} cm`, x + pxB + 10, y + pxH/2 + 5);

        } else if (gjeldendeFigur === 'trekant') {
            document.getElementById('figurnavn').textContent = "Figurtype: Rettvinklet trekant";
            let g = tilfeldig(6, 12);
            let h = tilfeldig(5, 10);
            let hyp = Math.sqrt((g*g) + (h*h));
            
            fasitAreal = Math.round((g * h) / 2);
            fasitOmkrets = Math.round(g + h + hyp);

            let scale = 22;
            let pxG = g * scale;
            let pxH = h * scale;
            let x = (canvas.width - pxG) / 2;
            let y = (canvas.height - pxH) / 2 + pxH;

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + pxG, y);
            ctx.lineTo(x, y - pxH);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#2c3e50';
            ctx.fillText(`g = ${g} cm`, x + pxG/2 - 20, y + 20);
            ctx.fillText(`h = ${h} cm`, x - 50, y - pxH/2 + 5);

        } else if (gjeldendeFigur === 'sirkel') {
            document.getElementById('figurnavn').textContent = "Figurtype: Sirkel";
            let r = tilfeldig(3, 6);
            fasitAreal = Math.round(Math.PI * r * r);
            fasitOmkrets = Math.round(2 * Math.PI * r);

            let scale = 24;
            let pxR = r * scale;
            let cx = canvas.width / 2;
            let cy = canvas.height / 2;

            ctx.beginPath();
            ctx.arc(cx, cy, pxR, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + pxR, cy);
            ctx.strokeStyle = '#e74c3c';
            ctx.stroke();

            ctx.fillStyle = '#2c3e50';
            ctx.fillText(`r = ${r} cm`, cx + pxR/3, cy - 8);

        } else if (gjeldendeFigur === 'halvsirkel') {
            document.getElementById('figurnavn').textContent = "Figurtype: Halvsirkel";
            let r = tilfeldig(4, 7);
            fasitAreal = Math.round((Math.PI * r * r) / 2);
            fasitOmkrets = Math.round((Math.PI * r) + (2 * r));

            let scale = 24;
            let pxR = r * scale;
            let cx = canvas.width / 2;
            let cy = canvas.height / 2 + (pxR / 2);

            ctx.beginPath();
            ctx.arc(cx, cy, pxR, Math.PI, 0, false);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#2c3e50';
            ctx.fillText(`d = ${r * 2} cm`, cx - 25, cy + 20);

        } else if (gjeldendeFigur === 'sammensatt_rektangel') {
            document.getElementById('figurnavn').textContent = "Figurtype: L-formet figur (Finn manglende sider selv!)";
            
            let a = tilfeldig(8, 12);  
            let b = tilfeldig(3, 5);   
            let c = tilfeldig(8, 12);  
            let d = tilfeldig(3, 5);   
            
            if (b >= a) b = a - 3;
            if (d >= c) d = c - 3;
            
            let e = a - b; 
            let f = c - d; 

            fasitAreal = (a * d) + (b * f);
            fasitOmkrets = a + b + c + d + e + f;

            let scale = 20;
            let startX = (canvas.width - (a * scale)) / 2;
            let startY = (canvas.height - (c * scale)) / 2;

            ctx.beginPath();
            ctx.moveTo(startX, startY); 
            ctx.lineTo(startX + (b * scale), startY); 
            ctx.lineTo(startX + (b * scale), startY + (f * scale)); 
            ctx.lineTo(startX + (a * scale), startY + (f * scale)); 
            ctx.lineTo(startX + (a * scale), startY + (c * scale)); 
            ctx.lineTo(startX, startY + (c * scale)); 
            ctx.closePath();
            
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#2c3e50';
            ctx.fillText(`${b} cm`, startX + (b * scale)/2 - 10, startY - 10); 
            ctx.fillText(`${c} cm`, startX - 35, startY + (c * scale)/2); 
            ctx.fillText(`${a} cm`, startX + (a * scale)/2 - 10, startY + (c * scale) + 20); 
            ctx.fillText(`${d} cm`, startX + (a * scale) + 10, startY + (f * scale) + (d * scale)/2 + 5); 

        } else if (gjeldendeFigur === 'rektangel_trekant') {
            document.getElementById('figurnavn').textContent = "Figurtype: Husform (rektangel + trekant)";
            
            let bredde = tilfeldig(8, 12);
            if (bredde % 2 !== 0) bredde += 1; 
            
            let rektangelHoyde = tilfeldig(4, 7);
            let trekantHoyde = tilfeldig(4, 6);

            let halvBredde = bredde / 2;
            let takSidelengde = Math.sqrt((halvBredde * halvBredde) + (trekantHoyde * trekantHoyde));
