<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometri-generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <h1>Geometri: Areal og Omkrets</h1>
        
        <div id="task-box">
            <h2 id="shape-title">Figur</h2>
            <p id="shape-description">Beskrivelse av figuren og dens mål.</p>
            
            <div class="input-group">
                <label for="user-perimeter">Hva er omkretsen?</label>
                <input type="number" id="user-perimeter" step="any" placeholder="Svar">
            </div>

            <div class="input-group">
                <label for="user-area">Hva er arealet?</label>
                <input type="number" id="user-area" step="any" placeholder="Svar">
            </div>

            <button id="submit-btn" onclick="checkAnswers()">Sjekk svar</button>
            <button id="next-btn" class="hidden" onclick="generateTask()">Neste oppgave</button>
        </div>

        <div id="feedback" class="feedback-box hidden"></div>
        <div id="score-board">Poeng: <span id="score">0</span></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
